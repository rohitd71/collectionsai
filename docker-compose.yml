services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend-api:
    build: ./backend
    command: node dist/api.js
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      - redis

  backend-worker:
    build: ./backend
    command: node dist/worker.js
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
